<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Filter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        .search {
            margin-bottom: 30px;
        }

        .search input {
            width: 300px;
            padding: 12px;
            border: 1px solid;
            border-radius: 6px;
            font-size: 16px;
        }

        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .product {
            width: 220px;
            padding: 20px;
            border: 1px solid;
            border-radius: 10px;
        }

        .product h3 {
            margin-top: 0;
        }

        .product button {
            padding: 10px 15px;
            border: 1px solid;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <center><h1>Products</h1></center>

    <div class="search">
        <input type="text" id="searchInput" placeholder="Search products..." onkeyup="filterProducts(this.value)">
    </div>

    <div class="container" id="productContainer"></div>

    <script src="./app.js"></script>

</body>

</html>
